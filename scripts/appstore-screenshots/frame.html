<!doctype html>
<!-- App Store / Play screenshot frame. Rendered by scripts/frame-appstore-screenshots.cjs
     (headless Chrome) as frame.html?shot=<file url>&a=<line 1>&b=<line 2>&sub=<tag>&ca=&cb=&top=&bottom=&h=<px>.
     Drawn on a stage 1320 units wide; `h` is the output height scaled to that width. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500..900&family=Space+Grotesk:wght@700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #E9F9E5; --ink: #111; --leaf: #41BC28; --sky: #00A9D8; --link: #E8E879;
    --indigo: #2049C5; --pink: #DB44A4; --orange: #EC8A13; --roots: #A3703E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  #stage {
    position: absolute; top: 0; left: 0; width: 1320px; transform-origin: 0 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(0,0,0,.07) 2px, transparent 2px),
      linear-gradient(90deg, rgba(0,0,0,.07) 2px, transparent 2px);
    background-size: 44px 44px; background-position: 22px 22px;
    font-family: 'DM Sans', sans-serif; color: var(--ink); overflow: hidden;
  }

  /* Headline: the landing page's highlighted chips, joined by a stem like an idea and its child. */
  .chip {
    position: absolute; left: 660px; transform: translate(-50%, -50%) rotate(var(--r));
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.035em; line-height: 1;
    font-size: var(--fs); padding: .13em .3em .17em; white-space: nowrap; background: var(--c); color: var(--fg, var(--ink));
    border: 7px solid var(--ink); border-radius: 14px; box-shadow: 10px 10px 0 2px var(--ink);
  }
  #a { --r: -1.5deg; }
  #b { --r: 1deg; }
  #stem { position: absolute; left: 657px; width: 7px; background: var(--ink); border-radius: 4px; }
  #sub {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 46px; font-weight: 700; letter-spacing: -0.01em; color: rgba(17,17,17,.72);
  }

  /* Phone: flat neobrutal slab with the app's hard offset shadow. */
  #phone { position: absolute; left: 50%; transform: translateX(-50%); background: var(--ink); border-radius: var(--pr); padding: var(--bz); box-shadow: 26px 26px 0 0 rgba(17,17,17,.9); }
  #phone::before { /* side button */
    content: ''; position: absolute; right: -12px; top: 22%; width: 12px; height: 9%; background: var(--ink); border-radius: 0 6px 6px 0;
  }
  #phone::after {
    content: ''; position: absolute; left: -12px; top: 17%; width: 12px; height: 6%; background: var(--ink); border-radius: 6px 0 0 6px;
  }
  #screen { position: relative; overflow: hidden; border-radius: var(--sr); display: flex; flex-direction: column; }
  #status { position: relative; flex: none; display: flex; align-items: center; justify-content: space-between; }
  #status .time { font-family: -apple-system, 'SF Pro Text', 'DM Sans', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  #status .icons { display: flex; align-items: center; }
  #island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 999px; }
  #shot { display: block; width: 100%; flex: none; }
  #home { position: relative; flex: none; }
  #home i { position: absolute; left: 50%; transform: translateX(-50%); background: #111; border-radius: 99px; }
</style>
</head>
<body>
<div id="stage">
  <div id="stem"></div>
  <div class="chip" id="a"></div>
  <div class="chip" id="b"></div>
  <div id="sub"></div>
  <div id="phone"><div id="screen">
    <div id="status"><span class="time">9:41</span><div id="island"></div><span class="icons"></span></div>
    <img id="shot">
    <div id="home"><i></i></div>
  </div></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const W = 1320, H = Math.round((+P.get('h') || innerHeight) * W / innerWidth);
const stage = document.getElementById('stage');
stage.style.height = H + 'px';
stage.style.transform = `scale(${innerWidth / W})`;

const col = (name) => (name.startsWith('#') ? name : `var(--${name})`);
const a = document.getElementById('a'), b = document.getElementById('b'), sub = document.getElementById('sub');
a.textContent = P.get('a'); b.textContent = P.get('b'); sub.textContent = P.get('sub');
// Per-shot tilt (ra, rb in degrees) and sideways shift (xa, xb in px) so the headlines don't all sit alike.
if (P.get('ra')) a.style.setProperty('--r', P.get('ra') + 'deg');
if (P.get('rb')) b.style.setProperty('--r', P.get('rb') + 'deg');
const xa = +P.get('xa') || 0, xb = +P.get('xb') || 0;
a.style.left = 660 + xa + 'px'; b.style.left = 660 + xb + 'px';
document.getElementById('stem').style.left = 657 + (xa + xb) / 2 + 'px';
a.style.setProperty('--c', col(P.get('ca') || 'leaf'));
b.style.setProperty('--c', col(P.get('cb') || 'sky'));
for (const [el, key] of [[a, 'ca'], [b, 'cb']]) if (['indigo', 'pink'].includes(P.get(key))) el.style.setProperty('--fg', '#fff');

const img = document.getElementById('shot');
img.src = P.get('shot');

Promise.all([document.fonts.ready, img.decode()]).then(() => {
  // Headline: one size for both lines, shrunk until the wider chip fits.
  let fs = 124;
  const fit = () => { for (const c of [a, b]) c.style.setProperty('--fs', fs + 'px'); return Math.max(a.offsetWidth, b.offsetWidth); };
  while (fit() > 1180 && fs > 70) fs -= 2;
  const single = !P.get('b'); // one-line headline: no second chip, no stem
  const chipH = a.offsetHeight, gap = single ? 0 : 46, topA = 70 + chipH / 2;
  a.style.top = topA + 'px';
  b.style.top = topA + chipH + gap + 'px';
  const stem = document.getElementById('stem');
  if (single) { b.style.display = 'none'; stem.style.display = 'none'; }
  stem.style.top = topA + chipH / 2 - 4 + 'px';
  stem.style.height = gap + 8 + 'px';
  const subTop = single ? topA + chipH / 2 + 60 : topA + chipH * 1.5 + gap + 34;
  sub.style.top = subTop + 'px';

  // Phone sized to the space left; screen = status bar + capture + home indicator, as on an iPhone.
  const top = subTop + 46 + 60, bottomPad = 70;
  const ratio = img.naturalHeight / img.naturalWidth, statusK = 0.137, homeK = 0.087;
  const bz = 24;
  const sw = Math.floor((H - top - bottomPad - 2 * bz) / (ratio + statusK + homeK));
  const phone = document.getElementById('phone'), screen = document.getElementById('screen');
  phone.style.top = top + 'px';
  phone.style.setProperty('--bz', bz + 'px');
  phone.style.setProperty('--pr', Math.round(sw * 0.145 + bz) + 'px');
  screen.style.setProperty('--sr', Math.round(sw * 0.145) + 'px');
  screen.style.width = sw + 'px';

  const status = document.getElementById('status'), island = document.getElementById('island');
  const u = sw / 393; // iPhone points
  Object.assign(status.style, { height: 54 * u + 'px', padding: `0 ${30 * u}px 0 ${48 * u}px`, background: P.get('top') || '#E9F9E5', paddingTop: 6 * u + 'px' });
  status.querySelector('.time').style.fontSize = 17 * u + 'px';
  Object.assign(island.style, { width: 124 * u + 'px', height: 36 * u + 'px', top: 11 * u + 'px' });
  const dark = P.get('fg') || '#111';
  status.querySelector('.time').style.color = dark;
  status.querySelector('.icons').innerHTML = `
    <svg width="${19 * u}" height="${12 * u}" viewBox="0 0 19 12" style="margin-right:${6 * u}px"><g fill="${dark}"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0" width="3.2" height="12" rx="1"/></g></svg>
    <svg width="${17 * u}" height="${12 * u}" viewBox="0 0 17 12" style="margin-right:${6 * u}px"><g fill="${dark}"><path d="M8.5 2.6c2.3 0 4.4.9 6 2.4l1.3-1.3A10.3 10.3 0 0 0 8.5.7 10.3 10.3 0 0 0 1.2 3.7L2.5 5a8.5 8.5 0 0 1 6-2.4z"/><path d="M8.5 6.3c1.3 0 2.5.5 3.4 1.3l1.3-1.3a6.6 6.6 0 0 0-9.4 0l1.3 1.3c.9-.8 2.1-1.3 3.4-1.3z"/><path d="M8.5 9.4c.5 0 1 .2 1.3.5L8.5 11.3 7.2 9.9c.3-.3.8-.5 1.3-.5z"/></g></svg>
    <svg width="${27 * u}" height="${13 * u}" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="${dark}" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.3" fill="${dark}"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill="${dark}" fill-opacity=".45"/></svg>`;

  const home = document.getElementById('home');
  Object.assign(home.style, { height: 34 * u + 'px', background: P.get('bottom') || '#E9F9E5' });
  Object.assign(home.querySelector('i').style, { width: 134 * u + 'px', height: 5 * u + 'px', bottom: 8 * u + 'px' });
  document.title = 'ready';
});
</script>
</body>
</html>
