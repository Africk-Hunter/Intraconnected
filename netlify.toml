[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# script-src allows 'unsafe-inline' (rather than hashing the JSON-LD block in
# index.html) because netlify.toml's [[headers]] block applies globally — not
# just in production, but to `netlify dev` too (confirmed: it broke local dev
# entirely, since @vitejs/plugin-react injects its own inline Fast Refresh
# preamble script that changes every session and can't be hashed in advance).
# A hash/nonce would make 'unsafe-inline' correctly ignored by modern browsers
# per the CSP spec, which is exactly what broke — so this drops the hash
# instead of adding one. Acceptable trade: this app has no XSS sinks anywhere
# (no dangerouslySetInnerHTML, no raw innerHTML — see the ship-readiness
# audit, programmer-docs/artifacts/shipping-readiness.md), so the marginal protection an inline-script block would add here is
# smaller than the cost of a CSP that's confirmed broken in a documented dev
# workflow (`npm run dev:functions` / `dev:stripe`, both `netlify dev`).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.stripe.com https://m.stripe.com https://m.stripe.network https://r.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
